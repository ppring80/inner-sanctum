[build]
  publish = "."
  functions = "netlify/functions"

[context.production]
  environment = { SECRETS_SCAN_ENABLED = "false" }

# PLAYER DATA REFRESH SCHEDULE (added — checklist #215)
# Runs refresh-player-data.js once a day at 00:00 UTC. That function
# loops all 32 NFL teams' rosters in parallel and caches each player's
# exp (rookie/veteran status) and injury designation to Netlify Blobs,
# which chat.js then reads on every Sanctum request instead of hitting
# Tank01 live (32 calls per chat message would be too slow and too
# expensive). See refresh-player-data.js for the full rationale.
#
# @daily = 00:00 UTC every day. If exp/injury data ever needs to be
# fresher than a once-a-day refresh, change this to "0 */6 * * *"
# (every 6 hours) -- no other code changes needed.
[functions."refresh-player-data"]
  schedule = "@daily"

# AUTOMATED FACT-CHECK SCHEDULE (added)
# Runs qa-fact-check.js daily at 00:30 UTC — deliberately 30 minutes
# AFTER refresh-player-data's 00:00 UTC run (above), so the
# player-data cache it samples from is guaranteed fresh for the day
# rather than racing it. See qa-fact-check.js for full rationale.
[functions."qa-fact-check"]
  schedule = "30 0 * * *"

# RISERS & FALLERS SCHEDULE — Feature #131 (added 2026-07-14)
# Runs refresh-risers-fallers.js weekly at 12:00 UTC every Wednesday.
# That function pulls the current and previous week's completed games
# via getNFLGamesForWeek, computes week-over-week target share and
# snap share deltas per player from getNFLBoxScore, and caches the
# result (risers, fallers, and the full delta list) to Netlify Blobs
# for the frontend to read live. See refresh-risers-fallers.js for the
# full rationale and the live-verified Tank01 field shapes it's built
# against.
#
# WEEKLY, not daily, unlike refresh-player-data above — target/snap
# share only meaningfully changes once a full week of games has
# completed, so a daily refresh would just be redundant Tank01 calls
# against unchanged data most days.
#
# Wednesday 12:00 UTC chosen so every game in the week's slate,
# including Monday Night Football, is final by the time this runs.
# Revisit this timing if the NFL ever schedules a game later than
# Monday night in a given week (e.g. certain international slates).
[functions."refresh-risers-fallers"]
  schedule = "0 12 * * 3"

# CAMP WATCH AUTO-GENERATOR SCHEDULE (added 2026-08-05)
# Runs generate-camp-watch.js TWICE a day, at 13:00 and 23:00 UTC —
# roughly 9am and 7pm US Eastern (8am/6pm Central) during EDT. That
# function pulls real, current fantasy-relevant news from Tank01's
# /getNFLNews endpoint (fantasyNews=true), generates fresh Oracle and
# Trash Lord takes on the top storylines via the Anthropic API, and
# caches the result to Netlify Blobs for dispatches.html's Camp Watch
# section to read live. See generate-camp-watch.js for full rationale,
# including why this replaces rather than accumulates each run.
#
# Twice-daily (not once, unlike refresh-player-data above) because
# Tank01 itself says this news feed updates multiple times an hour —
# a single daily pull would leave same-day practice reports and
# injury designations sitting stale for up to 24 hours, which is the
# exact "live but not really live" problem this function exists to
# fix. Twice a day was chosen over more frequent polling because camp
# news itself doesn't meaningfully change hour-to-hour (injury
# reports and practice recaps land once or twice a day, not
# continuously) — more frequent runs would mostly just reprocess the
# same underlying facts at extra API cost with no new substance.
#
# DST note: like refresh-risers-fallers's Wednesday timing above,
# this is a fixed UTC schedule and will drift an hour relative to US
# local time across the DST boundary. Not worth chasing with cron
# alone -- adjust the hours below manually if that drift ever matters
# enough to fix.
[functions."generate-camp-watch"]
  schedule = "0 13,23 * * *"

# CURRENT NFL FACTS (DEPTH CHART) SCHEDULE — V2.1 (added)
# Runs refresh-current-nfl-facts.js TWICE a day, at 13:30 and 23:30
# UTC — the same twice-daily cadence already established for
# generate-camp-watch.js above (offset by 30 minutes to avoid
# contending for the same minute), chosen for the identical reason:
# Tank01 itself says getNFLDepthCharts updates multiple times a day,
# but real depth-chart CHANGES (a promotion, a trade, an injury
# reshuffling a depth chart) don't happen continuously either — a
# single daily pull would leave same-day depth-chart moves stale for
# up to 24 hours, while polling more than twice a day would mostly
# just reprocess the same underlying facts at extra Tank01 cost with
# no new substance. See refresh-current-nfl-facts.js for the full
# rationale and the confirmed real Tank01 response shape it's built
# against.
#
# This is READ-ONLY input to refresh-player-snapshot.js (see that
# file's own comments) — it does not itself run Player Snapshot's
# aggregation, and this schedule is independent of
# refresh-player-snapshot.js's own trigger (currently manual/on-demand
# per the V2.1 implementation turn, unchanged by this addition).
[functions."refresh-current-nfl-facts"]
  schedule = "30 13,23 * * *"

# WEEKLY SAGE SHARED SCHEDULE EVIDENCE
# Builds and caches the current week's normalized schedule before
# any positional Weekly SAGE snapshot refresh begins.
#
# Tuesday 08:40 UTC -- 20 minutes before the first positional
# snapshot refresh at 09:00 UTC.
[functions."refresh-weekly-sage-schedule"]
  schedule = "40 8 * * 2"

# WEEKLY SAGE DEFENSE EVIDENCE
# Caches the completed week's defensive matchup evidence, one weekly
# schedule cycle behind the positional snapshots.
#
# Tuesday 08:50 UTC -- after the shared schedule (08:40 UTC) and
# before the first positional snapshot refresh (09:00 UTC).
[functions."refresh-weekly-sage-defense"]
  schedule = "50 8 * * 2"

# WEEKLY SAGE PRODUCTION SNAPSHOT REFRESH SCHEDULE (added)
# Runs each position's dedicated snapshot cache-writer ONCE weekly, at
# 09:00 UTC every Tuesday, staggered 5 minutes apart (QB/RB/WR/TE/K/DEF) to
# avoid six functions contending for Tank01 rate limits/CPU at the
# exact same instant -- the same staggering rationale already used
# for refresh-player-data (00:00 UTC) vs. its dependent job (00:30
# UTC) above.
#
# TIMING: 09:00 UTC is safely after Monday Night Football concludes
# (MNF kicks off ~8:15pm ET / ~00:15 UTC Tuesday and typically
# finishes by ~03:30 UTC), leaving buffer for Tank01 to finalize box
# scores, while still landing well before "Tuesday morning" for every
# US time zone (09:00 UTC = 4:00am CT / 5:00am ET / 2:00am PT) so
# Weekly Rankings is ready before customers check it.
#
# All six positions can safely run independently from the same
# completed-week data -- there is no cross-position dependency, so
# this is a staggering choice for load/contention only, not a
# required execution order.
#
# Only the six snapshot cache-writers are scheduled here. The
# positional leaderboards and the unified weekly-sage-rankings
# endpoint remain request-time reads (they read whatever the most
# recent scheduled snapshot refresh already cached) -- scheduling
# them would recompute nothing new and only add unnecessary Tank01
# traffic, per this task's explicit "do not schedule analytical
# leaderboard functions unless required" instruction.
[functions."refresh-qb-snapshot"]
  schedule = "0 9 * * 2"

[functions."refresh-rb-snapshot"]
  schedule = "5 9 * * 2"

[functions."refresh-wr-snapshot"]
  schedule = "10 9 * * 2"

[functions."refresh-te-snapshot"]
  schedule = "15 9 * * 2"

[functions."refresh-k-snapshot"]
  schedule = "20 9 * * 2"

[functions."refresh-def-snapshot"]
  schedule = "25 9 * * 2"

# CHATGPT / MCP OAUTH DISCOVERY
# Standard OAuth discovery URLs used by ChatGPT when the
# Inner Sanctum MCP app is configured with Authentication = OAuth.
#
# These are Netlify rewrites (status 200), not browser redirects.
# The public .well-known URLs remain visible while Netlify routes
# the request to the appropriate metadata action in chatgpt-oauth.js.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/chatgpt-oauth?action=protected-resource"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/chatgpt-oauth?action=authorization-server"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/"
  status = 308

[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 308

[[redirects]]
  from = "/home.html"
  to = "/"
  status = 308

[[redirects]]
  from = "/sanctum.html"
  to = "/sanctum"
  status = 308

# PATREON OAUTH CALLBACK REDIRECT (added)
# PATREON_REDIRECT_URI (Netlify env var, and the redirect URI
# registered in Patreon's own developer app settings) points at
# https://theinnersanctum.xyz/oauth/callback -- a friendly path that
# doesn't correspond to any real file or page. This rule is what
# makes that path actually work: it quietly proxies to the real
# Netlify Function at /.netlify/functions/oauth-callback, which does
# the actual token exchange and sets the session cookie.
#
# Without this rule, Patreon would redirect a real logged-in user
# back to a URL that 404s -- the OAuth flow would complete on
# Patreon's side (the user really did authorize and really did get a
# code), but the site would never receive or use that code, so no
# session would ever get created. Discovered missing 2026-06-27 while
# debugging why a real test subscription's login never unlocked
# anything -- this redirect rule's absence was the root cause, not
# anything wrong with oauth-callback.js itself.
#
# status = 200 (a rewrite/proxy), NOT a 3xx redirect -- the browser's
# address bar should keep showing /oauth/callback (matching exactly
# what's registered with Patreon) while Netlify serves the function's
# response from underneath, rather than visibly bouncing the user to
# a different-looking URL.
[[redirects]]
  from = "/oauth/callback"
  to = "/.netlify/functions/oauth-callback"
  status = 200

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

# CACHE CONTROL (added)
# Added after a real bug: rapid back-to-back testing of weekly.html
# served a stale cached copy with old "Ask [Persona]" links pointing
# at the wrong player, even after the page had been updated. A hard
# reload fixed it that time, but a real customer wouldn't know to do
# that. These rules tell the browser to always re-validate with the
# server before using a cached copy of these pages, rather than
# trusting an old copy silently. Applied to all the dynamic, frequently
# iterated app pages (not just weekly.html, which caused the actual
# incident) since auction.html/tiers.html/sanctum.html share the same
# theoretical exposure to this failure mode even though it hasn't
# been observed on those specifically. Static assets (favicon, CSS via
# CDN, etc.) are NOT covered here and don't need to be -- this is only
# for pages whose content changes between deploys and where a stale
# copy could mislead a user, the same risk this bug demonstrated.
[[headers]]
  for = "/weekly"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sanctum"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/auction"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/tiers"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Added same session as compare.html's build (checklist #130) — this is
# the same category of page as auction/tiers/sanctum/weekly (fetches
# live data on every load), so it gets the same stale-cache protection
# from day one rather than waiting to hit the exact bug weekly.html
# already demonstrated before adding it here too. No redirect rule
# needed for /compare itself — Netlify's default clean-URL resolution
# already serves compare.html at /compare automatically, the same way
# /draft, /tiers, /auction, /weekly, and /survivor all work today with
# no explicit redirect entries for any of them either.
[[headers]]
  for = "/compare"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Added 2026-08-05, same reasoning as /compare above — dispatches.html
# now fetches Camp Watch live from get-dispatches.js on every load
# (see dispatches.html and generate-camp-watch.js), so it joins the
# same category of pages that must never be served from a stale
# browser cache.
[[headers]]
  for = "/dispatches"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
