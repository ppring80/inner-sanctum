<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Publish Week 2 Rankings | The Inner Sanctum</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #100b06; color: #f8edd2; }
    main { width: min(680px, calc(100% - 32px)); padding: 32px; border: 1px solid #9d7626; border-radius: 18px; background: #1a1209; box-shadow: 0 18px 60px #0008; }
    h1 { margin-top: 0; color: #d9aa42; }
    .summary { padding: 16px; border-radius: 12px; background: #0f0c08; line-height: 1.55; }
    label { display: block; margin: 22px 0 8px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 14px; border: 1px solid #705821; border-radius: 10px; background: #090705; color: white; font: inherit; }
    button { width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: 10px; background: #d9aa42; color: #171005; font: 800 1rem/1 system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5em; margin-bottom: 0; }
    .note { color: #c9bda8; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Publish approved Week 2 rankings</h1>
    <div class="summary">
      <strong>Instagram:</strong> @theinnersanctum.ff<br>
      <strong>Media:</strong> 6-image QB/RB/WR/TE carousel<br>
      <strong>Caption:</strong> Approved Sunday rankings caption
    </div>
    <form id="publish-form">
      <label for="publish-key">Instagram publishing key</label>
      <input id="publish-key" name="publish-key" type="password" autocomplete="off" required>
      <p class="note">The key is sent only to the Inner Sanctum publishing function. It is not saved by this page.</p>
      <button id="publish-button" type="submit">Publish carousel to Instagram</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const endpoint = "/.netlify/functions/instagram-publish";
    const payload = {
      confirmPublish: true,
      idempotencyKey: "week2-top5-rankings-2026-09-20",
      caption: "The Week 2 half-PPR board is set for Sunday.\n\nJustin Jefferson leads the wide receivers. Lamar Jackson is QB1. Bijan Robinson sits at RB1, and Trey McBride is the clear TE1.\n\nJoe Burrow is still questionable. Puka Nacua stays WR5, but the Monday-night kickoff makes a backup plan mandatory. Don’t leave yourself stuck if his status turns late.\n\nThese are the current rankings. Injuries and inactive announcements can still move the board before kickoff.\n\nCheck the full rankings before you lock the lineup:\ntheinnersanctum.xyz/sage\n\n#FantasyFootball #FantasyFootballRankings #StartSit #Week2",
      imageUrls: [
        "https://theinnersanctum.xyz/week2-top5-cover.jpg",
        "https://theinnersanctum.xyz/week2-top5-quarterbacks.jpg",
        "https://theinnersanctum.xyz/week2-top5-running-backs.jpg",
        "https://theinnersanctum.xyz/week2-top5-wide-receivers.jpg",
        "https://theinnersanctum.xyz/week2-top5-tight-ends.jpg",
        "https://theinnersanctum.xyz/week2-top5-cta.jpg"
      ]
    };
    document.getElementById("publish-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const keyInput = document.getElementById("publish-key");
      const button = document.getElementById("publish-button");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Publishing… do not close this page.";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-instagram-publish-key": keyInput.value },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || "publish_failed");
        status.textContent = result.duplicate
          ? `Already published. Instagram media ID: ${result.mediaId}`
          : `Published successfully. Instagram media ID: ${result.mediaId}`;
        button.textContent = "Published";
      } catch (error) {
        status.textContent = `Could not publish: ${error.message}`;
        button.disabled = false;
      } finally {
        keyInput.value = "";
      }
    });
  </script>
</body>
</html>
