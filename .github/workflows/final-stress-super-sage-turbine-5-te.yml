name: Final Stress Super SAGE Turbine 5 TE
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python scripts/build-super-sage-historical-lab.py --start 2019 --end 2025 --out data/sage-historical-lab
      - run: python scripts/build-super-sage-historical-cause-ledger.py --start 2019 --end 2025 --out data/sage-historical-cause-ledger
      - run: python scripts/stress-super-sage-turbine-5-te.py --players data/sage-historical-lab/player-weeks.csv --causes data/sage-historical-cause-ledger/cause-ledger.csv --out data/sage-historical-lab/turbine-5-final-te.json
      - uses: actions/upload-artifact@v4
        with: {name: super-sage-turbine-5-final-te, path: data/sage-historical-lab/turbine-5-final-te.json, retention-days: 30}
