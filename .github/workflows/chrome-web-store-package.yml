name: Chrome Web Store Package

on:
  pull_request:
    paths:
      - 'cbs-extension/**'
      - 'scripts/package-chrome-extension.py'
      - 'chrome-web-store-privacy.html'
      - 'docs/CHROME_WEB_STORE_SUBMISSION.md'
      - 'tests/chrome-web-store-package.test.js'
      - '.github/workflows/chrome-web-store-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Chrome Web Store regression gate
        run: node tests/chrome-web-store-package.test.js

      - name: Build clean Chrome Web Store ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-chrome-extension.py --output dist/inner-sanctum-connect-0.5.2-cws.zip
          python3 scripts/package-chrome-extension.py --verify dist/inner-sanctum-connect-0.5.2-cws.zip

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: inner-sanctum-connect-0.5.2-cws
          path: |
            dist/inner-sanctum-connect-0.5.2-cws.zip
            dist/inner-sanctum-connect-0.5.2-cws.sha256
          if-no-files-found: error
          retention-days: 30
