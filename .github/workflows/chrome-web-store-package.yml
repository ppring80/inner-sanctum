name: Chrome Web Store Package

on:
  pull_request:
    paths:
      - 'cbs-extension/**'
      - 'chrome-web-store-privacy.html'
      - 'docs/CHROME_WEB_STORE_SUBMISSION.md'
      - 'tests/chrome-web-store-package.test.js'
      - '.github/workflows/chrome-web-store-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Chrome Web Store regression gate
        run: node tests/chrome-web-store-package.test.js

      - name: Build clean Chrome Web Store ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/cws/icons
          cp cbs-extension/manifest.json dist/cws/
          cp cbs-extension/service-worker.js dist/cws/
          cp cbs-extension/service-worker-v050.js dist/cws/
          cp cbs-extension/cbs-browser-connector.js dist/cws/
          cp cbs-extension/cbs-content-bridge.js dist/cws/
          cp cbs-extension/cbs-main-bridge.js dist/cws/
          cp cbs-extension/cbs-free-agent-capture.js dist/cws/
          cp cbs-extension/espn-content-bridge.js dist/cws/
          cp cbs-extension/espn-main-bridge.js dist/cws/
          cp cbs-extension/sanctum-content-bridge.js dist/cws/
          cp cbs-extension/icons/icon-16.png dist/cws/icons/
          cp cbs-extension/icons/icon-32.png dist/cws/icons/
          cp cbs-extension/icons/icon-48.png dist/cws/icons/
          cp cbs-extension/icons/icon-128.png dist/cws/icons/
          (
            cd dist/cws
            zip -r -X ../inner-sanctum-connect-0.5.2-cws.zip .
          )
          sha256sum dist/inner-sanctum-connect-0.5.2-cws.zip | tee dist/inner-sanctum-connect-0.5.2-cws.sha256
          test "$(unzip -Z1 dist/inner-sanctum-connect-0.5.2-cws.zip | head -1)" = "manifest.json"
          ! unzip -Z1 dist/inner-sanctum-connect-0.5.2-cws.zip | grep -Eq '(^|/)(__MACOSX|\.git|tests|docs)(/|$)'

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: inner-sanctum-connect-0.5.2-cws
          path: |
            dist/inner-sanctum-connect-0.5.2-cws.zip
            dist/inner-sanctum-connect-0.5.2-cws.sha256
          if-no-files-found: error
          retention-days: 30
