name: Free Agents language polish one-time update

on:
  push:
    branches:
      - free-agents-extraction

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-agents-extraction
          fetch-depth: 0

      - name: Apply surgical Free Agents label changes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('free-agents.html')
          s = page.read_text()

          replacements = {
            "No provider-reported waiver candidates are available yet": "No provider-reported free agents are available yet",
            "Waiver intelligence depends on your actual roster and your league’s available-player pool.": "Free Agent intelligence depends on your actual roster and your league’s available-player pool.",
            "Waiver intelligence is unavailable right now.": "Free Agent intelligence is unavailable right now.",
            "+p+'</button>'": "+(p==='K'?'PK':p)+'</button>'",
          }

          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected page text: {old}')
            s = s.replace(old, new)

          if 'Available For You' in s:
            raise SystemExit('old product name still present in free-agents.html')
          page.write_text(s)

          test = Path('tests/free-agents-board.test.js')
          t = test.read_text()
          anchor = "  assert.ok(!mainScript.includes('Available For You'), 'the old product name must not appear on the extracted page');\n"
          addition = anchor + "  assert.ok(mainScript.includes(\"p==='K'?'PK':p\"), 'kicker filter should display PK while retaining internal K identity');\n"
          if anchor not in t:
            raise SystemExit('test insertion anchor not found')
          if "kicker filter should display PK" not in t:
            t = t.replace(anchor, addition)
          test.write_text(t)
          PY

      - name: Run focused regression gates
        run: |
          node tests/free-agents-board.test.js
          node tests/dispatches-no-available-for-you.test.js
          node tests/cbs-free-agent-capture.test.js
          git diff origin/main...HEAD --check

      - name: Commit polished labels and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-agents.html tests/free-agents-board.test.js
          git commit -m "Polish Free Agents customer labels"
          git push origin HEAD:free-agents-extraction
