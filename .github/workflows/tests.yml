name: Inner Sanctum Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run canonical regression gate
        run: npm test

      - name: Print 2026 RB Schedule Intelligence board
        if: success()
        run: node tests/sage-rb-schedule-board.js
