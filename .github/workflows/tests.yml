name: Inner Sanctum Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'support.html'
      - 'privacy.html'
      - 'terms.html'
      - 'google-site-verification*'
  workflow_dispatch:

concurrency:
  group: inner-sanctum-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run canonical regression gate
        run: npm test

      - name: Print 2026 RB Schedule Intelligence board
        if: success()
        run: node tests/sage-rb-schedule-board.js
