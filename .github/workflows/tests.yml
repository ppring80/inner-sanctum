name: Inner Sanctum Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Draft Fit unit tests
        run: node tests/draft-fit-profile.test.js

      - name: Run Draft Fit scenario tests
        run: node tests/draft-fit-scenarios.test.js

      - name: Run Draft Intelligence scenario tests
        run: node tests/draft-intelligence-scenarios.test.js

      - name: Run Draft Intelligence ranking tests
        run: node tests/draft-intelligence-ranking.test.js

      - name: Run Draft Intelligence output contract tests
        run: node tests/draft-intelligence-output.test.js

      - name: Run Draft Intelligence explanation tests
        run: node tests/draft-intelligence-explanations.test.js

      - name: Run Patreon multi-membership regression tests
        run: node tests/patreon-multi-membership.test.js

      - name: Run 2026 RB Schedule Intelligence tests
        run: node tests/sage-rb-schedule-2026.test.js
