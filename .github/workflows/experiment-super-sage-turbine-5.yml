name: Experiment Super SAGE Turbine 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Build Historical Lab V1
        run: python scripts/build-super-sage-historical-lab.py --start 2019 --end 2026 --end-2026-week 3 --out data/sage-historical-lab
      - name: Run Turbine 5 experiment
        run: |
          python scripts/run-super-sage-state-transition-experiment.py \
            --players data/sage-historical-lab/player-weeks.csv \
            --out data/sage-historical-lab/turbine-5-state-transition.json
      - name: Guard experiment integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/sage-historical-lab/turbine-5-state-transition.json").read_text())
          assert r["noLookAhead"] is True
          assert r["causeInference"].startswith("NONE")
          assert set(r["thresholds"])=={"RB","WR","TE"}
          for split in ("discovery","validation","holdout"):
              assert r["splits"][split]["n"]>0
          print(json.dumps(r,indent=2))
          PY
      - name: Upload experiment result
        uses: actions/upload-artifact@v4
        with:
          name: super-sage-turbine-5-state-transition
          path: data/sage-historical-lab/turbine-5-state-transition.json
          if-no-files-found: error
          retention-days: 30
