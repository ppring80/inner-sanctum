name: Weekly Tools Production Health
on:
  schedule:
    # Tuesday morning production acceptance checks. GitHub cron is UTC and
    # cannot express America/Los_Angeles DST directly, so run at both candidate
    # 06:00 Pacific UTC offsets; the read-only verifier is safe to run twice.
    # January covers the final regular-season rollover.
    - cron: '0 13,14 * 1,9-12 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-tools-production-health
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify real caches and controlled FAAB fixtures
        run: node scripts/verify-weekly-tools.js
