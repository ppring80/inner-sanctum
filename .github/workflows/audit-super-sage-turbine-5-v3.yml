name: Audit Super SAGE Turbine 5 V3
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python scripts/build-super-sage-historical-lab.py --start 2019 --end 2025 --out data/sage-historical-lab
      - run: python scripts/build-super-sage-historical-cause-ledger.py --start 2019 --end 2025 --out data/sage-historical-cause-ledger
      - name: Audit V3 robustness
        run: python scripts/audit-super-sage-turbine-5-v3.py --players data/sage-historical-lab/player-weeks.csv --causes data/sage-historical-cause-ledger/cause-ledger.csv --out data/sage-historical-lab/turbine-5-v3-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: super-sage-turbine-5-v3-audit
          path: data/sage-historical-lab/turbine-5-v3-audit.json
          retention-days: 30
