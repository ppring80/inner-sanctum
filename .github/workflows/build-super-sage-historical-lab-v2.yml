name: Build Super SAGE Historical Lab V2

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: First PBP season
        required: true
        default: '2016'
      end_2026_week:
        description: Last 2026 week
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Build play-level corpus
        run: |
          python scripts/build-super-sage-historical-lab-v2.py --start "${{ inputs.start_season }}" --end 2026 --end-2026-week "${{ inputs.end_2026_week }}" --out data/sage-historical-lab-v2
      - name: Validate play-level corpus
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          root=Path("data/sage-historical-lab-v2")
          m=json.loads((root/"manifest.json").read_text())
          p=pd.read_csv(root/"plays.csv.gz",compression="gzip",low_memory=False)
          start=int("${{ inputs.start_season }}"); last=int("${{ inputs.end_2026_week }}")
          assert set(range(start,2027)).issubset(set(p.season.astype(int).unique()))
          assert int(p.loc[p.season==2026,"week"].max())==last
          assert not len(p[(p.season==2026)&(p.week>last)])
          assert len(p)>300000, len(p)
          assert p.game_id.nunique()>2500, p.game_id.nunique()
          assert p.play_id.notna().mean()>.99
          assert {"epa","success","air_yards","qb_dropback","receiver_player_id","rusher_player_id"}.issubset(p.columns)
          print({"plays":len(p),"games":p.game_id.nunique(),"seasons":sorted(p.season.astype(int).unique().tolist()),"2026MaxWeek":int(p.loc[p.season==2026,"week"].max())})
          PY
      - name: Upload V2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-sage-historical-lab-v2-2016-2026w3
          path: data/sage-historical-lab-v2/
          if-no-files-found: error
          retention-days: 30
