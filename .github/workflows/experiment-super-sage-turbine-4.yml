name: Experiment Super SAGE Turbine 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy
      - name: Build Historical Lab V1
        run: |
          python scripts/build-super-sage-historical-lab.py --start 2019 --end 2026 --end-2026-week 3 --out data/sage-historical-lab
      - name: Run Turbine 4 experiment
        run: |
          python scripts/run-super-sage-game-environment-experiment.py \
            --players data/sage-historical-lab/player-weeks.csv \
            --out data/sage-historical-lab/turbine-4-game-environment.json
      - name: Guard experiment integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/sage-historical-lab/turbine-4-game-environment.json")
          r=json.loads(p.read_text())
          assert r["noLookAhead"] is True
          assert "result" in r["forbiddenPredictors"]
          for split in ("discovery","validation","holdout"):
              assert r["splits"][split]["marketCoverage"] >= .95, r["splits"][split]
          print(json.dumps(r,indent=2))
          PY
      - name: Upload experiment result
        uses: actions/upload-artifact@v4
        with:
          name: super-sage-turbine-4-game-environment
          path: data/sage-historical-lab/turbine-4-game-environment.json
          if-no-files-found: error
          retention-days: 30
