name: Hotfix Draft SAGE Access

on:
  push:
    paths:
      - '.github/workflows/hotfix-draft-sage-access.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch passcode access into server session
        run: |
          echo '' | base64 -d > /tmp/hotfix.py
          python /tmp/hotfix.py
          git diff --check
          grep -q "ensureInviteServerSession" draft.html
          grep -q "draft-invite-passcode" netlify/functions/invite-session.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draft.html netlify/functions/invite-session.js
          git commit -m "Restore SAGE for passcode Draft access"
          git push origin HEAD:main
