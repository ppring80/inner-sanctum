name: Experiment Super SAGE Turbine 5 V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Build Historical Lab
        run: python scripts/build-super-sage-historical-lab.py --start 2019 --end 2026 --end-2026-week 3 --out data/sage-historical-lab
      - name: Run Five V2
        run: python scripts/run-super-sage-state-transition-v2-experiment.py --players data/sage-historical-lab/player-weeks.csv --out data/sage-historical-lab/turbine-5-v2.json
      - name: Guard integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/sage-historical-lab/turbine-5-v2.json").read_text())
          assert r["noLookAhead"] is True
          assert r["v1Disposition"]=="REJECTED"
          assert set(r["thresholds"])=={"RB","WR","TE"}
          for s in ("discovery","validation","holdout"): assert r["splits"][s]["n"]>0
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: super-sage-turbine-5-v2
          path: data/sage-historical-lab/turbine-5-v2.json
          if-no-files-found: error
          retention-days: 30
