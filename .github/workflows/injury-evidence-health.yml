name: Injury Evidence Health
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Inner Sanctum Tests"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: injury-evidence-health
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover official evidence using short-lived workflow identity
        run: node scripts/refresh-injury-evidence-workflow.js
      - name: Verify cached evidence freshness
        run: node scripts/verify-injury-evidence.js
