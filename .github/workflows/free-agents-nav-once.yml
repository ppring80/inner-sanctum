name: Free Agents nav one-time update

on:
  push:
    branches:
      - free-agents-extraction

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-agents-extraction
          fetch-depth: 0

      - name: Add Free Agents to Season Tools navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          standard_files = [
              'tiers.html',
              'survivor.html',
              'compare.html',
              'risers-fallers.html',
              'connect-league.html',
              'power-rankings.html',
              'draft.html',
              'auction.html',
              'sanctum.html',
          ]

          weekly_anchor = '<a href="/weekly">📅 Weekly Rankings</a>'
          free_anchor = '<a href="/free-agents">🎯 Free Agents</a>'

          for name in standard_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if free_anchor in text:
                  raise SystemExit(f'{name}: Free Agents link already present; refusing duplicate')
              count = text.count(weekly_anchor)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one Weekly Rankings anchor, found {count}')
              text = text.replace(weekly_anchor, weekly_anchor + free_anchor, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('weekly.html')
          text = path.read_text(encoding='utf-8')
          if free_anchor in text:
              raise SystemExit('weekly.html: Free Agents link already present; refusing duplicate')
          power_anchor = '<a href="/power-rankings">📊 League Power Rankings</a>'
          count = text.count(power_anchor)
          if count != 1:
              raise SystemExit(f'weekly.html: expected exactly one Power Rankings anchor, found {count}')
          text = text.replace(power_anchor, power_anchor + '\n        ' + free_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/free-agents-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiers.html survivor.html compare.html risers-fallers.html connect-league.html power-rankings.html draft.html auction.html sanctum.html weekly.html .github/workflows/free-agents-nav-once.yml
          git diff --cached --check
          git commit -m "Add Free Agents to Season Tools navigation"
          git push origin HEAD:free-agents-extraction
